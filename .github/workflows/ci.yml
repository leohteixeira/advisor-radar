name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.22.0

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned binary is used instead of the marketplace action so that CI
      # and the Dev Container run the exact same gitleaks version.
      - name: Install gitleaks
        run: |
          set -Eeuo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${base}/${archive}" -o "${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        run: gitleaks git --redact --no-banner

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  go:
    name: Go module
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the gated internal/sim and internal/cases
      # PostgreSQL tests. Test-only credentials; each test migrates and drops
      # its own schema, so both packages share the database safely.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: citest
          POSTGRES_PASSWORD: citest
          POSTGRES_DB: account_sim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citest -d account_sim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify formatting
        run: |
          set -Eeuo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      - name: Test with the race detector
        env:
          ACCOUNT_SIM_TEST_DATABASE_URL: postgres://citest:citest@localhost:5432/account_sim_test?sslmode=disable
          CASES_TEST_DATABASE_URL: postgres://citest:citest@localhost:5432/account_sim_test?sslmode=disable
          ADVISORY_TEST_DATABASE_URL: postgres://citest:citest@localhost:5432/account_sim_test?sslmode=disable
        run: go test -race -shuffle=on ./...
