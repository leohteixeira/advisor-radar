name: advisor-radar

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5435:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - advisor_radar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-localdev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-localdev}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - advisor_radar_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - advisor_radar_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Grafana, Tempo, Mimir (Prometheus), and Loki behind one OTLP collector.
  # Services export to it when OTEL_EXPORTER_OTLP_ENDPOINT is set
  # (http://127.0.0.1:4418). Grafana is on 3410: 3000 belongs to Cybersecurity.
  otel-lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "3410:3000"
      - "4417:4317"
      - "4418:4318"

volumes:
  advisor_radar_pg:
  advisor_radar_rabbitmq:
  advisor_radar_es:
